    <!-- Menu Desktop -->

      class="d-none d-lg-flex flex-column vh-100 position-fixed"

      <nav id="menu-principal-desktop" class="nav flex-column px-3 gap-1">
        <span id="linha-menu" class="bc-tertiary-color"></span>
        <p id="menu-heading" class="m-0">MENU PRINCIPAL</p>

        <a class="nav-link d-flex align-items-center" href="../../../index.html">

              type="image/webp"
            />
            <img
              class="menu-icon"
              src="../../../img/icones/home.svg"
              alt=""
              aria-hidden="true"

              height="19"
            />
          </picture>
          Dashboard

        <a class="nav-link d-flex align-items-center" href="../produtos/index.html">

            <img
              class="menu-icon"
              src="../../../img/icones/caixa_icone.svg"
              alt=""

        <a

            <img

        <a

          href="./index.html"
        >
          <picture>
            <source
              srcset="../../../img/icones/request_quote-elementor-io-optimized.webp"
              type="image/webp"
            />
            <img
              class="menu-icon"
              src="../../../img/icones/request_quote.svg"
              alt=""
              aria-hidden="true"
              width="19"
              height="19"
            />
          </picture>
          Movimentações
        </a>
      </nav>
    </aside>
    <!-- Conteúdo Principal -->
    <main class="min-vh-100">
      <header class="page-header shadow-sm">
        <h1 id="titulo-principal" class="fw-bold mb-0 text-dark">
          Movimentações
        </h1>
      </header>
      <div class="px-3 px-lg-4 container-fluid">
        <section
          class="card shadow-sm border-0 rounded-3 p-4 movimentacao-card"
        >
          <div class="d-flex align-items-center gap-2 mb-4">
            <picture class="movimentacao-title-icon">
              <source
                srcset="
                  ../../../img/icones/add_circle_purple-elementor-io-optimized.webp
                "
                type="image/webp"
              />
              <img
                src="../../../img/icones/add_circle_purple.svg"
                alt=""
                aria-hidden="true"
              />
            </picture>
            <h2 class="titulo-secao fw-bold mb-0 text-dark">
              Nova Movimentação
            </h2>
          </div>

          <form id="form-movimentacao">
            <div class="mb-4">
              <label class="form-label fw-medium" for="tipo-movimentacao"
                >Tipo de Movimentação *</label
              >

              <div id="tipo-movimentacao" class="movimentacao-tipo-grid">
                <input
                  class="btn-check"
                  type="radio"
                  name="tipoMovimentacao"
                  id="tipo-entrada"
                  value="entrada"
                  checked
                />
                <label
                  class="movimentacao-tipo movimentacao-tipo-entrada"
                  for="tipo-entrada"
                >
                  <img
                    src="../../../img/icones/arrow_right_alt_entry.svg"
                    alt=""
                    aria-hidden="true"
                    width="18"
                    height="18"
                  />
                  Entrada
                </label>
                <input
                  class="btn-check"
                  type="radio"
                  name="tipoMovimentacao"
                  id="tipo-saida"
                  value="saida"
                />
                <label
                  class="movimentacao-tipo movimentacao-tipo-saida"
                  for="tipo-saida"
                >
                  <img
                    src="../../../img/icones/arrow_right_alt_exit.svg"
                    alt=""
                    aria-hidden="true"
                    width="18"
                    height="18"
                  />
                  Saída
                </label>
              </div>
            </div>

            <div class="movimentacao-form-area">
              <div class="meu-grupo-input">
                <label for="input-produto-movimentacao">Produto *</label>
                <select id="input-produto-movimentacao" required>
                  <option value="" disabled selected>
                    Selecione um produto
                  </option>
                </select>
              </div>

              <div class="meu-grupo-input">
                <label for="input-quantidade-movimentacao">Quantidade *</label>
                <input
                  id="input-quantidade-movimentacao"
                  type="number"
                  placeholder="Quantidade"
                  required
                />
              </div>
            </div>

            <hr class="movimentacao-linha" />

            <div class="movimentacao-footer">
              <button
                type="button"
                class="btn btn-outline-secondary px-4 py-2 d-inline-flex align-items-center justify-content-center gap-2"
              >
                <img
                  src="../../../img/icones/close.svg"
                  alt=""
                  aria-hidden="true"
                  width="18"
                  height="18"
                />
                Cancelar
              </button>

              <button
                type="submit"
                class="btn btn-salvar-movimentacao text-white px-4 py-2"
              >
                <picture>
                  <source
                    srcset="../../../img/icones/save-elementor-io-optimized.webp"
                    type="image/webp"
                  />
                  <img
                    src="../../../img/icones/save.svg"
                    alt=""
                    aria-hidden="true"
                    width="20"
                    height="20"
                  />
                </picture>
                Salvar produto
              </button>
            </div>
          </form>
        </section>

        <section class="card shadow-sm border-0 rounded-3 p-3 mb-4">
          <h2 class="titulo-secao fw-bold mb-3 text-dark">
            Histórico de Movimentações
          </h2>

          <div class="table-responsive">
            <table
              id="historico-movimentacoes-table"
              class="tabela-sistema table table-hover align-middle mb-0"
            >
              <caption class="visually-hidden">
                Tabela de histórico de movimentações
              </caption>

              <thead class="small text-uppercase">
                <tr>
                  <th scope="col" class="titulo-tabela-produtos">Produto</th>
                  <th scope="col" class="titulo-tabela-produtos text-center">
                    Tipo
                  </th>
                  <th scope="col" class="titulo-tabela-produtos text-center">
                    Quantidade
                  </th>
                  <th scope="col" class="titulo-tabela-produtos text-center">
                    Data
                  </th>
                </tr>
              </thead>

              <tbody class="small"></tbody>
            </table>
          </div>
        </section>
      </div>

    <!-- Modal -->
